openapi: 3.1.1
info:
  title: Learning Fieldbook
  version: 1.0.0
  description: >-
    The notebook and family journal require the exact configured Host. Unsafe requests
    require the exact configured Origin. Cookie-authenticated writes also use
    a session-bound CSRF token. Responses use Cache-Control no-store, private.
servers:
  - url: /api/v1
paths:
  /auth/enroll/start:
    post:
      summary: Begin passkey setup while signed out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Single-use operator setup code }
      responses:
        '200': { $ref: '#/components/responses/Ceremony' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/enroll/finish:
    post:
      summary: Verify registration and consume the setup grant
      requestBody: { $ref: '#/components/requestBodies/Credential' }
      responses:
        '204': { description: Passkey enrolled }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/sign-in/start:
    post:
      summary: Begin passkey sign-in after ending the previous session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ceremony' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/sign-in/finish:
    post:
      summary: Verify a sign-in assertion and set the session cookie
      requestBody: { $ref: '#/components/requestBodies/Credential' }
      responses:
        '200': { $ref: '#/components/responses/NewSession' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/step-up/start:
    post:
      summary: Begin reauthentication for the signed-in guardian
      security:
        - session: []
          csrf: []
      responses:
        '200': { $ref: '#/components/responses/Ceremony' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/step-up/finish:
    post:
      summary: Verify the guardian assertion and rotate the current session
      description: The verification lasts five minutes. Diary access is governed by its own record scope and audit requirements.
      security:
        - session: []
          csrf: []
      requestBody: { $ref: '#/components/requestBodies/Credential' }
      responses:
        '200': { $ref: '#/components/responses/NewSession' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /session:
    get:
      summary: Get the current actor, CSRF token and remaining session time
      security:
        - session: []
      responses:
        '200': { $ref: '#/components/responses/CurrentSession' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      summary: End the active session and expire the cookie
      security:
        - session: []
          csrf: []
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /session/keep-alive:
    post:
      summary: Refresh the 15-minute idle window within the original eight-hour lifetime
      security:
        - session: []
          csrf: []
      responses:
        '200': { $ref: '#/components/responses/CurrentSession' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /households/{id}:
    get:
      summary: Read the signed-in learner or guardian’s household record
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The caller’s household
          content:
            application/json:
              schema:
                type: object
                required: [id, label]
                properties:
                  id: { type: string, format: uuid }
                  label: { type: string }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Household is absent or inaccessible }
  /moments/new/:
    servers: [{ url: / }]
    post:
      summary: Save the browser form and redirect to the saved moment
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, submission_key]
              properties:
                csrf_token: { type: string }
                submission_key: { type: string, format: uuid }
                learner_id: { type: string, format: uuid }
                note: { type: string }
                activity_date: { type: string, format: date }
                asset_ids: { type: string, description: Comma-separated finalized asset UUIDs in display order }
                scribed: { type: boolean, default: false }
      responses:
        '303':
          description: Saved moment
          headers:
            Location:
              schema: { type: string }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/JournalMissing' }
        '409': { $ref: '#/components/responses/SubmissionConflict' }
        '422': { description: Validation failed. Submitted note and activity date are retained in the response. }
  /journal/learners:
    get:
      summary: List learners available for family capture
      security: [{ session: [] }]
      responses:
        '200':
          description: Learners in the actor's capture scope
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, display_name]
                  properties:
                    id: { type: string, format: uuid }
                    display_name: { type: string }
        '404': { $ref: '#/components/responses/JournalMissing' }
  /moments:
    get:
      summary: Read the family journal in descending activity-date order
      security: [{ session: [] }]
      responses:
        '200': { $ref: '#/components/responses/MomentList' }
        '404': { $ref: '#/components/responses/JournalMissing' }
    post:
      summary: Record one attributed family moment
      description: A replay with the same actor, submission key and input returns the same moment ID and original wording.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMoment' }
      responses:
        '201':
          description: Saved moment, including successful replays
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Moment' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/JournalMissing' }
        '409': { $ref: '#/components/responses/SubmissionConflict' }
        '422': { description: Invalid text, date, learner selection or asset list }
  /moments/{id}:
    parameters:
      - $ref: '#/components/parameters/MomentId'
    get:
      summary: Read a family moment
      security: [{ session: [] }]
      responses:
        '200': { $ref: '#/components/responses/JournalMoment' }
        '404': { $ref: '#/components/responses/JournalMissing' }
    patch:
      summary: Revise the authenticated writer’s own words or activity date
      description: Submit the complete note and activity date for the new revision. Null clears an optional field.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision]
              properties:
                expected_revision: { type: integer, minimum: 1 }
                note: { type: [string, 'null'] }
                activity_date: { type: [string, 'null'], format: date }
      responses:
        '200': { $ref: '#/components/responses/JournalMoment' }
        '404': { $ref: '#/components/responses/JournalMissing' }
        '409': { $ref: '#/components/responses/StaleMoment' }
        '422': { description: Invalid text or date }
  /moments/{id}/revisions:
    parameters:
      - $ref: '#/components/parameters/MomentId'
    get:
      summary: Read preserved family moment revisions, newest first
      security: [{ session: [] }]
      responses:
        '200': { $ref: '#/components/responses/MomentList' }
        '404': { $ref: '#/components/responses/JournalMissing' }
  /moments/{id}/confirmation:
    parameters:
      - $ref: '#/components/parameters/MomentId'
    post:
      summary: Confirm the current revision of words entered by a guardian
      security: [{ session: [], csrf: [] }]
      requestBody: { $ref: '#/components/requestBodies/ExpectedMomentRevision' }
      responses:
        '200': { $ref: '#/components/responses/JournalMoment' }
        '404': { $ref: '#/components/responses/JournalMissing' }
        '409': { $ref: '#/components/responses/StaleMoment' }
    delete:
      summary: Withdraw the learner’s confirmation of the current revision
      security: [{ session: [], csrf: [] }]
      requestBody: { $ref: '#/components/requestBodies/ExpectedMomentRevision' }
      responses:
        '200': { $ref: '#/components/responses/JournalMoment' }
        '404': { $ref: '#/components/responses/JournalMissing' }
        '409': { $ref: '#/components/responses/StaleMoment' }
  /moments/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/MomentId'
    get:
      summary: List dated comments visible to the current actor
      security: [{ session: [] }]
      responses:
        '200':
          description: Family comments and the actor’s own withdrawn comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JournalComment' }
        '404': { $ref: '#/components/responses/JournalMissing' }
    post:
      summary: Add an attributed comment or suggestion
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submission_key, kind, body]
              properties:
                submission_key: { type: string, format: uuid }
                kind: { type: string, enum: [comment, suggestion] }
                body: { type: string }
      responses:
        '201':
          description: Saved comment
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalComment' }
        '404': { $ref: '#/components/responses/JournalMissing' }
        '409': { $ref: '#/components/responses/SubmissionConflict' }
        '422': { description: Invalid comment body or kind }
  /moments/{id}/comments/{comment}:
    parameters:
      - $ref: '#/components/parameters/MomentId'
      - $ref: '#/components/parameters/CommentId'
    get:
      summary: Read one visible comment
      security: [{ session: [] }]
      responses:
        '200': { $ref: '#/components/responses/JournalComment' }
        '404': { $ref: '#/components/responses/JournalMissing' }
    delete:
      summary: Withdraw a comment as its author
      security: [{ session: [], csrf: [] }]
      responses:
        '204': { description: Comment withdrawn }
        '404': { $ref: '#/components/responses/JournalMissing' }
  /moments/{id}/comments/{comment}/restore:
    parameters:
      - $ref: '#/components/parameters/MomentId'
      - $ref: '#/components/parameters/CommentId'
    post:
      summary: Restore an author’s withdrawn comment under its original ID
      security: [{ session: [], csrf: [] }]
      responses:
        '200': { $ref: '#/components/responses/JournalComment' }
        '404': { $ref: '#/components/responses/JournalMissing' }
  /uploads:
    post:
      summary: Begin a private upload or replay the same manifest
      description: >-
        Requires filesystem media storage. Each manifest is scoped to the signed-in
        learner or guardian. An unfinished upload expires after 24 hours without
        committed progress. The creation response returns the current resume offset.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [submission_key, label, byte_count, sha256, media_type]
              properties:
                submission_key: { type: string, format: uuid }
                label: { type: string, minLength: 1, maxLength: 255, description: Trimmed display label of at most 255 UTF-8 bytes }
                byte_count: { type: integer, format: int64, minimum: 1, maximum: 8589934592 }
                sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
                media_type:
                  type: string
                  enum: [application/octet-stream, application/pdf, application/zip, image/jpeg, image/png, image/webp, video/mp4, video/quicktime, video/webm]
                  description: Use application/octet-stream for opaque project or source files.
      responses:
        '201':
          description: Stable upload handle
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateUpload' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UploadMissing' }
        '409': { description: This submission key already identifies a different manifest or an expired upload awaiting cleanup }
        '422': { description: Invalid manifest or unsupported declared media type }
        '503': { $ref: '#/components/responses/UploadUnavailable' }
  /uploads/{id}:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    get:
      summary: Read the upload's committed resume offset and finalization state
      security:
        - session: []
      responses:
        '200': { $ref: '#/components/responses/UploadStatus' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UploadMissing' }
        '503': { $ref: '#/components/responses/UploadUnavailable' }
  /uploads/{id}/parts/{offset}:
    parameters:
      - $ref: '#/components/parameters/UploadId'
      - name: offset
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 0 }
    put:
      summary: Write a part at the committed offset or replay identical committed bytes
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/UploadStatus' }
        '400': { description: Invalid offset syntax }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UploadMissing' }
        '409': { description: Wrong offset, out-of-bounds part, or changed replay. Read status to recover the current offset. }
        '413': { description: Part exceeds 8 MiB }
        '415': { description: Part requests require application/octet-stream }
        '422': { description: Empty part }
        '503': { $ref: '#/components/responses/UploadUnavailable' }
  /uploads/{id}/finalize:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    post:
      summary: Publish a verified immutable original and return its asset ID
      description: >-
        When the committed length, SHA-256 and declared format checks pass, the asset
        can be saved to a family moment. Replays return the same asset ID. If
        verification fails with 422, start a new upload with a new submission key.
      security:
        - session: []
          csrf: []
      responses:
        '200': { $ref: '#/components/responses/UploadStatus' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UploadMissing' }
        '409': { description: Upload is incomplete }
        '422': { description: The complete staged file failed its length, digest or signature check }
        '503': { $ref: '#/components/responses/UploadUnavailable' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-fieldbook
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    UploadId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MomentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommentId:
      name: comment
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    PrivateUpload:
      type: object
      required: [id, label, byte_count, received, media_type, asset_id]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        byte_count: { type: integer, format: int64 }
        received: { type: integer, format: int64 }
        media_type: { type: string }
        asset_id:
          type: [string, 'null']
          format: uuid
          description: Null until finalization commits.
    Session:
      type: object
      required: [actor, csrf_token, idle_seconds, elevated_seconds]
      properties:
        actor:
          type: object
          required: [id, household_id, username, display_name, role]
          properties:
            id: { type: string, format: uuid }
            household_id: { type: string, format: uuid }
            username: { type: string }
            display_name: { type: string }
            role: { type: string, enum: [learner, guardian, guest] }
        csrf_token: { type: string }
        idle_seconds: { type: integer, minimum: 1, maximum: 900 }
        elevated_seconds: { type: integer, minimum: 0, maximum: 300 }
    CreateMoment:
      type: object
      required: [submission_key]
      properties:
        submission_key: { type: string, format: uuid }
        learner_id:
          type: [string, 'null']
          format: uuid
          description: Required for guardian capture. A learner can submit under their own account.
        scribed:
          type: boolean
          default: false
          description: A guardian entered the learner’s spoken words. The learner can confirm that revision.
        note: { type: [string, 'null'], description: A note or at least one finalized asset is required }
        activity_date: { type: [string, 'null'], format: date }
        asset_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
          description: Finalized private assets of the recorder, in display order
    Moment:
      type: object
      required: [id, learner_id, learner_name, recorder_id, recorder_name, editor_id, editor_name, voice, visibility, activity_date, created_at, updated_at, revision, note, asset_ids, confirmed]
      properties:
        id: { type: string, format: uuid }
        learner_id: { type: string, format: uuid }
        learner_name: { type: string }
        recorder_id: { type: string, format: uuid }
        recorder_name: { type: string }
        editor_id: { type: string, format: uuid }
        editor_name: { type: string }
        voice: { type: string, enum: [student, scribed, guardian] }
        visibility: { const: family }
        activity_date: { type: [string, 'null'], format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        revision: { type: integer, minimum: 1 }
        note: { type: [string, 'null'] }
        asset_ids:
          type: array
          items: { type: string, format: uuid }
        confirmed: { type: boolean, description: Whether the exact scribed revision has an active learner confirmation }
    JournalComment:
      type: object
      required: [id, author_id, author_name, body, kind, created_at, withdrawn]
      properties:
        id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        author_name: { type: string }
        body: { type: string }
        kind: { type: string, enum: [comment, suggestion] }
        created_at: { type: string, format: date-time }
        withdrawn: { type: boolean }
  requestBodies:
    ExpectedMomentRevision:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [expected_revision]
            properties:
              expected_revision: { type: integer, minimum: 1 }
    Credential:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ceremony, credential]
            properties:
              ceremony: { type: string }
              credential: { type: object, description: Browser WebAuthn credential JSON }
  responses:
    UploadStatus:
      description: Current private upload state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PrivateUpload' }
    UploadMissing:
      description: Upload is absent, expired or inaccessible to this caller
    UploadUnavailable:
      description: Private filesystem or database is unavailable, or this host has no filesystem upload backend
    Ceremony:
      description: Two-minute, single-use WebAuthn ceremony
      content:
        application/json:
          schema:
            type: object
            required: [ceremony, options]
            properties:
              ceremony: { type: string }
              options:
                type: object
                required: [publicKey]
                properties:
                  publicKey: { type: object, description: Browser WebAuthn public key options JSON }
    CurrentSession:
      description: Verified session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Session' }
    NewSession:
      description: Verified session with a new Secure, HttpOnly, SameSite Strict cookie
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Session' }
    SignInRequired:
      description: Missing, expired or invalid credential, ceremony, or session
    Forbidden:
      description: Host, origin, CSRF or actor role check failed
    Conflict:
      description: Session already active or credential already enrolled

    JournalMissing:
      description: Family record is absent or inaccessible to the caller
    SubmissionConflict:
      description: This actor’s submission key has already been used with different input
    JournalMoment:
      description: Attributed family moment
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Moment' }
    MomentList:
      description: Ordered visible moments or moment revisions
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Moment' }
    JournalComment:
      description: Signed family comment
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JournalComment' }
    StaleMoment:
      description: Expected revision changed. The authorized writer can compare and retry.
      content:
        application/json:
          schema:
            type: object
            required: [error, saved, submitted]
            properties:
              error: { const: stale_revision }
              saved: { $ref: '#/components/schemas/Moment' }
              submitted: { type: object }
