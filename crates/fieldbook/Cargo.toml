[package]
name = "fieldbook"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
