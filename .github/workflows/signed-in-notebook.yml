name: Signed-in notebook

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: fictional-ci-b1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:fictional-ci-b1@127.0.0.1:5432/postgres
      FIELDBOOK_TEST_DATABASE_URL: postgres://postgres:fictional-ci-b1@127.0.0.1:5432/postgres
      FIELDBOOK_TEST_ORIGIN: http://localhost:4180
      FIELD_PUBLIC_ORIGIN: http://localhost:4180
      FIELD_RP_ID: localhost
      FIELD_SESSION_SECRET: disposable-notebook-ci-fixture-secret
      PORT: 4180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config postgresql-client
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test --locked --test health -- --ignored
      - run: cargo build --workspace --locked
      - working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
          npx playwright install --with-deps chromium
      - run: |
          target/debug/fieldbook migrate
          target/debug/fieldbook serve &
          trap 'kill "$!"' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 "$FIELD_PUBLIC_ORIGIN/readyz"
          npm --prefix web test
